services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: budget
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  # Одноразовый прогон миграций из стадии builder (там полный prisma CLI со всеми зависимостями).
  migrate:
    build:
      context: .
      target: builder
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    command: sh -c "node_modules/.bin/prisma migrate deploy"
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    # Ключ сервис-аккаунта — из GOOGLE_SA_JSON_B64 (в .env из Infisical). Файл не монтируется.
    networks: [internal, edge]

networks:
  internal:
    driver: bridge
  edge:
    external: true

volumes:
  pgdata:
